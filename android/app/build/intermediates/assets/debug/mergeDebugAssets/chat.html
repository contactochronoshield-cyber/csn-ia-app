<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CSN IA</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0c0e; color: #d8ddd9; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 16px; border-bottom: 1px solid #2a2f2c; background: #0f1214; }
  header h1 { font-size: 15px; letter-spacing: 2px; margin: 0; color: #7de08d; }
  header p { margin: 4px 0 0; font-size: 11px; color: #6b756f; }
  #messages { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .msg { margin-bottom: 14px; max-width: 85%; padding: 10px 12px; border-radius: 2px; font-size: 13px; line-height: 1.5; }
  .user { margin-left: auto; background: #16221a; border: 1px solid #2f4a38; color: #cfe8d6; }
  .bot { background: #14171a; border: 1px solid #22262a; color: #c7cdc9; }
  #inputRow { display: flex; padding: 10px; border-top: 1px solid #2a2f2c; background: #0f1214; }
  #inputRow input { flex: 1; background: #14171a; border: 1px solid #2a2f2c; color: #d8ddd9; padding: 10px; font-family: monospace; font-size: 13px; }
  #inputRow button { margin-left: 8px; background: #7de08d; color: #0a0c0e; border: none; padding: 0 16px; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
  <header>
    <h1>CSN // ASISTENTE</h1>
    <p>Funciona sin internet. Pregunta sobre nuestros servicios.</p>
  </header>
  <div id="messages"></div>
  <div id="inputRow">
    <input id="userInput" placeholder="Escribe tu pregunta..." />
    <button onclick="sendMessage()">ENVIAR</button>
  </div>

<script>
  // Base de conocimiento de CSN, 100% local, sin servidor ni internet.
  const KB = [
    { keys: ["red privada", "que es una red", "vpn", "pasillo"],
      answer: "Una red privada es como un pasillo cifrado entre tus dispositivos que nadie mas puede ver ni usar. Con el Chrono Mesh Node, puedes conectarte a tus camaras, computadores o servidores desde cualquier lugar, de forma segura." },
    { keys: ["mesh node", "nodo mesh", "hardware", "placa"],
      answer: "El Chrono Mesh Node es nuestro dispositivo fisico: lo conectas a tu red local y se convierte en la puerta de entrada segura a tu red privada. Incluye software listo para usar y un video guia. Lo vendemos en Mercado Libre." },
    { keys: ["sentinel", "monitoreo", "vigilar", "alertas"],
      answer: "Chrono Sentinel es nuestra app de monitoreo: te avisa si algo falla o se comporta raro en tu red, sin que tengas que estar mirando pantallas todo el dia. Codigo en GitHub, y pronto en Google Play." },
    { keys: ["soberania", "soberano", "por que csn", "independencia"],
      answer: "Soberania digital significa que tus datos y tu infraestructura no dependen de servidores de otros paises ni de empresas extranjeras que pueden subir precios o cortar el servicio. Con CSN, todo corre en infraestructura propia." },
    { keys: ["wireguard", "activar", "conectar", "configurar"],
      answer: "WireGuard es la tecnologia detras del tunel cifrado. Con tu Mesh Node ya configurado, solo escaneas un codigo QR desde la app y quedas conectado a tu red privada en segundos." },
    { keys: ["precio", "costo", "cuanto vale", "comprar"],
      answer: "Puedes ver el Chrono Mesh Node y sus precios directamente en nuestra publicacion de Mercado Libre. Escribenos si tienes dudas puntuales sobre un plan especifico." },
    { keys: ["hola", "buenas", "que tal"],
      answer: "Hola! Soy el asistente de CSN. Preguntame que es una red privada, para que sirve el Mesh Node, o sobre Sentinel." }
  ];

  const FALLBACK = "No tengo informacion especifica sobre eso todavia, pero puedo contarte sobre nuestra red privada, el Mesh Node, Chrono Sentinel, o nuestra filosofia de soberania digital. Que te interesa?";

  function findAnswer(text) {
    // Motor Android local
    if (window.CSNIA && typeof window.CSNIA.ask === 'function') {
      try {
        const response = window.CSNIA.ask(text);
        if (response) return response;
      } catch (error) {
        console.error('CSN IA local engine error:', error);
      }
    }

    // Respaldo para navegador/WebView sin puente nativo
    const lower = text.toLowerCase();
    for (const item of KB) {
      for (const key of item.keys) {
        if (lower.includes(key)) return item.answer;
      }
    }

    return FALLBACK;
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');

  function addMessage(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    inputEl.value = '';
    setTimeout(() => addMessage(findAnswer(text), 'bot'), 250);
  }

  inputEl.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });

  addMessage('Hola, soy el asistente de CSN. Preguntame que es una red privada, para que sirve el Mesh Node, o sobre Sentinel.', 'bot');
</script>
</body>
</html>
