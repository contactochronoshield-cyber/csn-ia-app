<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CSN IA</title>
<style>
  @font-face {
    font-family: 'Orbitron';
    src: local('Orbitron');
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0c0e;
    color: #d8ddd9;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid #2a2f2c;
    background: #0f1214;
  }
  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    margin: 0;
    color: #7de08d;
  }
  header p {
    margin: 4px 0 0;
    font-size: 11px;
    color: #6b756f;
  }
  #settings {
    font-size: 10px;
    color: #55605a;
    padding: 6px 16px;
    border-bottom: 1px solid #1c201d;
  }
  #settings input {
    background: transparent;
    border: none;
    border-bottom: 1px solid #2a2f2c;
    color: #9aa39c;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    width: 60%;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }
  .msg {
    margin-bottom: 14px;
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 2px;
    font-size: 13px;
    line-height: 1.5;
  }
  .user {
    margin-left: auto;
    background: #16221a;
    border: 1px solid #2f4a38;
    color: #cfe8d6;
  }
  .bot {
    background: #14171a;
    border: 1px solid #22262a;
    color: #c7cdc9;
  }
  #inputRow {
    display: flex;
    padding: 10px;
    border-top: 1px solid #2a2f2c;
    background: #0f1214;
  }
  #inputRow input {
    flex: 1;
    background: #14171a;
    border: 1px solid #2a2f2c;
    color: #d8ddd9;
    padding: 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
  }
  #inputRow button {
    margin-left: 8px;
    background: #7de08d;
    color: #0a0c0e;
    border: none;
    padding: 0 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <header>
    <h1>CSN // ASISTENTE</h1>
    <p>Pregúntame qué es una red privada, un nodo mesh, o cómo empezar.</p>
  </header>
  <div id="settings">
    Servidor: <input id="backendUrl" value="http://192.168.1.100:8085/chat" />
  </div>
  <div id="messages"></div>
  <div id="inputRow">
    <input id="userInput" placeholder="Escribe tu pregunta..." />
    <button onclick="sendMessage()">ENVIAR</button>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const backendUrlEl = document.getElementById('backendUrl');
  let history = [];

  function addMessage(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    inputEl.value = '';

    const thinkingDiv = document.createElement('div');
    thinkingDiv.className = 'msg bot';
    thinkingDiv.textContent = '...';
    messagesEl.appendChild(thinkingDiv);

    try {
      const res = await fetch(backendUrlEl.value, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history })
      });
      const data = await res.json();
      thinkingDiv.textContent = data.response || '(sin respuesta)';
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: data.response });
    } catch (e) {
      thinkingDiv.textContent = 'No pude conectar con el servidor CSN. Verifica la dirección en Servidor arriba.';
    }
  }

  inputEl.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });

  addMessage('Hola, soy el asistente de CSN. Pregúntame qué es una red privada, para qué sirve el Mesh Node, o cómo empezar.', 'bot');
</script>
</body>
</html>
